name: 'Deploy to Sitepaste'
description: 'Sync markdown files to Sitepaste and trigger a build'
inputs:
  api-token:
    required: true
    description: 'Sitepaste API token'
  content-dir:
    required: false
    default: 'content'
    description: 'Path to markdown files'
  content-type:
    required: false
    default: 'docs'
    description: 'Content type for all pages: docs, blog, or standalone. Subdirectories become sections: /docs/{section}/{slug} for docs and blog, /{section}/{slug} for standalone.'
  site-id:
    required: false
    description: 'Target site UUID'
  dry-run:
    required: false
    default: 'false'
    description: 'Validate and preview without syncing or building'
  prune:
    required: false
    default: 'false'
    description: 'Delete pages of this content type that exist on the site but not in the content directory, making the directory the single source of truth. Only pages matching content-type are ever deleted. With dry-run, lists the pages that would be deleted.'
outputs:
  page-count:
    description: 'Number of pages synced'
    value: ${{ steps.deploy.outputs.page-count }}
  deploy-url:
    description: 'URL of the deployed site'
    value: ${{ steps.deploy.outputs.deploy-url }}
runs:
  using: 'composite'
  steps:
    - id: deploy
      shell: bash
      run: python3 "${{ github.action_path }}/main.py"
      env:
        INPUT_API_TOKEN: ${{ inputs.api-token }}
        INPUT_CONTENT_DIR: ${{ inputs.content-dir }}
        INPUT_CONTENT_TYPE: ${{ inputs.content-type }}
        INPUT_SITE_ID: ${{ inputs.site-id }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_PRUNE: ${{ inputs.prune }}
